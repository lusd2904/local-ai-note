services:
  backend:
    build:
      context: ./backend
    container_name: note_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8008}:8000"
    volumes:
      - ./data:/app/data
    env_file: [.env]
    environment:
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - DATABASE_URL=sqlite:////app/data/notes.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: note_frontend
    restart: always
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
